<div class="modal-header d-flex justify-content-between align-items-center">
    <h5 class="modal-title mb-0" id="modal-basic-title">{{ title }}</h5>
    <button type="button" class="btn btn-close-white btn-lg p-0" aria-label="Close" (click)="cancel()">
        <fa-icon [icon]="fa.faTimesCircle"></fa-icon>
    </button>
</div>
<div class="modal-body" [innerHTML]="message">
</div>
<div class="modal-footer">
  <button *ngIf="showCancelButton" class="btn btn-sm custom-cancel-button px-4 py-2 me-2" (click)="cancel()"
  [style.background-color]="cancelButtonColor"
  >{{ cancelBtnText }}</button>
  <button *ngIf="showConfirmButton" class="btn btn-sm btn-teal htc-border-radius px-4 py-2" (click)="confirm()"
  [style.background-color]="confirmButtonColor">{{ confirmBtnText }}</button>
</div>
