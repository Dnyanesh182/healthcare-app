<div class="modal-header d-flex justify-content-between align-items-center">
  <h5 class="modal-title mb-0" id="modal-basic-title">{{ modalHeader }}</h5>
  <button type="button" class="btn btn-close-white btn-lg p-0" aria-label="Close" (click)="onCancel()">
    <fa-icon [icon]="fa.faTimesCircle"></fa-icon>
  </button>
</div>
<div class="modal-body d-flex flex-column align-items-center">
  <img class="image-preview" [src]="imagePreview || existingImageUrl" alt="Image Preview" />
  <div *ngIf="errorMsg" class="error-msg mb-2">{{ errorMsg }}</div>
  <p class="text-muted text-center mb-2">
    Max file size: 2MB. Supported formats: JPG, JPEG, PNG
  </p>
  <input type="file" #fileInput accept=".jpg,.jpeg,.png" (change)="onFileChange($event)" hidden />
  <div class="d-flex justify-content-center gap-2 mt-2">
    <button type="button" class="btn btn-sm custom-cancel-button px-4 py-2 me-2" (click)="fileInput.click()">
      {{ uploadBtnText || 'Upload' }}
    </button>
    <button type="button" class="btn btn-sm btn-teal htc-border-radius px-4 py-2" [disabled]="!lastValidFile"
      (click)="onSave()">
      Save
    </button>
  </div>
</div>
